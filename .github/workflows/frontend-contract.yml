name: Frontend and API contract

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm run test:coverage && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chromium

  api-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_asset_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_asset_contract"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test_user:test_password@127.0.0.1:5432/test_asset_contract
    steps:
      # Backend from PR #24 is merged into develop; test the backend/ of the
      # same commit as the frontend instead of a separately pinned checkout.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:integration
        working-directory: frontend
        env:
          BACKEND_PYTHON: python
          PLAYWRIGHT_BROWSER_CHANNEL: chromium
      - name: Verify asset UI against PostgreSQL
        run: python -m scripts.verify_asset_api --ui
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chromium
