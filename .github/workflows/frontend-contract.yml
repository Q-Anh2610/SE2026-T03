name: Frontend and API contract

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm run test:coverage && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chromium

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PR #24 is not merged yet. Pin the backend tested with this frontend;
      # after integration replace this checkout with the repository's backend/.
      - uses: actions/checkout@v4
        with:
          ref: 575cee46150c76c34d1b080d099654ae07fb09fd
          path: .contract-backend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r .contract-backend/backend/requirements-dev.txt
      - run: python -m pytest
        working-directory: .contract-backend/backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:integration
        working-directory: frontend
        env:
          BACKEND_CONTRACT_DIR: ../.contract-backend/backend
          BACKEND_PYTHON: python
          PLAYWRIGHT_BROWSER_CHANNEL: chromium
